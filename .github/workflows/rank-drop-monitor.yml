name: SEO Rank Drop Monitor

on:
  # Run daily at 07:00 UTC
  schedule:
    - cron: '0 7 * * *'

  # Manual trigger with optional keyword override for demos
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip Slack, print blocks to log)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force_alert:
        description: 'Force alert even if drop is below threshold'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Analyse the ranking drop
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Detect & Analyse Rank Drop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      triggered: ${{ steps.run_analysis.outputs.triggered }}
      issue_type: ${{ steps.run_analysis.outputs.issue_type }}
      urgency: ${{ steps.run_analysis.outputs.urgency }}
      confidence: ${{ steps.run_analysis.outputs.confidence }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r seo_monitor/requirements.txt

      - name: Run rank drop analysis
        id: run_analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_ALERT: ${{ github.event.inputs.force_alert || 'false' }}
        run: |
          OUTPUT=$(python3 seo_monitor/analyze_rank_drop.py)
          echo "Raw output: $OUTPUT"

          TRIGGERED=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('triggered','false'))")
          ISSUE_TYPE=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('issue_type','unknown'))")
          URGENCY=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('urgency','low'))")
          CONFIDENCE=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('confidence_score',0))")

          echo "triggered=$TRIGGERED" >> $GITHUB_OUTPUT
          echo "issue_type=$ISSUE_TYPE" >> $GITHUB_OUTPUT
          echo "urgency=$URGENCY" >> $GITHUB_OUTPUT
          echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT

          echo "### Analysis Result" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered | $TRIGGERED |" >> $GITHUB_STEP_SUMMARY
          echo "| Issue Type | $ISSUE_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| Urgency | $URGENCY |" >> $GITHUB_STEP_SUMMARY
          echo "| Confidence | $CONFIDENCE |" >> $GITHUB_STEP_SUMMARY

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-analysis-${{ github.run_id }}
          path: /tmp/analysis.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Commit analysis result to repo as dated JSON (always runs)
  # ────────────────────────────────────────────────────────────────────────────
  store:
    name: Store Results to Git
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 5

    permissions:
      contents: write   # required to commit and push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            # full history needed for git pull --rebase

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r seo_monitor/requirements.txt

      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: seo-analysis-${{ github.run_id }}
          path: /tmp/

      - name: Commit daily result
        env:
          GIT_USER_EMAIL: "actions@github.com"
          GIT_USER_NAME:  "github-actions[bot]"
        run: python3 seo_monitor/store_results.py

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Send Slack alert (only if drop was detected)
  # ────────────────────────────────────────────────────────────────────────────
  alert:
    name: Send Slack Alert
    runs-on: ubuntu-latest
    needs: [analyze, store]
    timeout-minutes: 5

    # Only run if a significant drop was detected
    if: needs.analyze.outputs.triggered == 'True'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r seo_monitor/requirements.txt

      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: seo-analysis-${{ github.run_id }}
          path: /tmp/

      - name: Post Slack alert
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — Slack credentials cleared"
            unset SLACK_BOT_TOKEN
            unset SLACK_CHANNEL_ID
          fi
          python3 seo_monitor/slack_alert.py

      - name: Post summary to GitHub
        if: always()
        run: |
          echo "### Slack Alert" >> $GITHUB_STEP_SUMMARY
          echo "- **Issue Type:** ${{ needs.analyze.outputs.issue_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Urgency:** ${{ needs.analyze.outputs.urgency }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Confidence:** ${{ needs.analyze.outputs.confidence }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Alert sent:** ✅" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Notify if the workflow itself failed
  # ────────────────────────────────────────────────────────────────────────────
  notify_failure:
    name: Notify on Pipeline Failure
    runs-on: ubuntu-latest
    needs: [analyze, store, alert]
    if: failure()

    steps:
      - name: Send failure alert to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "'"$SLACK_CHANNEL_ID"'",
              "text": ":x: *SEO Monitor pipeline failed* — Run: ${{ github.run_id }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }'
